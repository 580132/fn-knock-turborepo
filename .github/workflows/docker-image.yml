name: Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22.22.3"
  NPM_VERSION: "10.8.2"

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout fn-knock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve gateway commit
        id: gateway
        shell: bash
        run: |
          sha="$(node -p 'require("./version.json").gatewayCommit')"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "FN_KNOCK_GO_SOURCE_COMMIT=${sha}" >> "${GITHUB_ENV}"
          echo "FN_KNOCK_GATEWAY_COMMIT=${sha}" >> "${GITHUB_ENV}"

      - name: Checkout frozen Go gateway
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kci-lnk/Go-Reauth-Proxy
          path: Go-Reauth-Proxy
          ref: ${{ steps.gateway.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go-Reauth-Proxy/go.mod
          cache-dependency-path: Go-Reauth-Proxy/go.sum

      - name: Install Task
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install dependencies
        shell: bash
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci

      - name: Build runtime assets
        shell: bash
        env:
          FN_KNOCK_GO_REAUTH_PROXY_DIR: ${{ github.workspace }}/Go-Reauth-Proxy
          FN_KNOCK_GO_SKIP_TESTS: "1"
          FN_KNOCK_RUNTIME_GATEWAY_ARCHES: amd64
          FN_KNOCK_BUILD_RUST_BACKEND: "0"
          FN_KNOCK_FORCE_FRONTEND_REBUILD: "1"
        run: |
          bash ./scripts/assemble-runtime.sh dist/fn-knock-artifacts/runtime

      - name: Build static Go gateway for Alpine
        shell: bash
        env:
          FN_KNOCK_GO_SKIP_TESTS: "1"
        run: |
          bash ./scripts/build-go-release.sh "${GITHUB_WORKSPACE}/Go-Reauth-Proxy" \
            "${GITHUB_WORKSPACE}/dist/fn-knock-go-release"

      - name: Build musl Rust backend
        shell: bash
        env:
          FN_KNOCK_GATEWAY_COMMIT: ${{ steps.gateway.outputs.sha }}
        run: |
          bash ./scripts/build-rust-backend.sh musl amd64 \
            "dist/fn-knock-artifacts/musl-rust-backends/server-admin-rs-linux-amd64"

      - name: Stage Docker build context
        shell: bash
        run: |
          runtime="dist/fn-knock-artifacts/runtime"
          rm -rf apps/fn-knock/app/ui/www apps/fn-knock/app/server-auth-view/dist
          mkdir -p apps/fn-knock/app/ui/www apps/fn-knock/app/server-auth-view/dist apps/fn-knock/app/server deploy/docker/rust-backends
          cp -a "${runtime}/ui/www/." apps/fn-knock/app/ui/www/
          cp -a "${runtime}/server-auth-view/dist/." apps/fn-knock/app/server-auth-view/dist/
          cp "dist/fn-knock-go-release/go-reauth-proxy-linux-amd64" apps/fn-knock/app/server/
          if readelf -l apps/fn-knock/app/server/go-reauth-proxy-linux-amd64 | grep -q INTERP; then
            echo 'Go gateway unexpectedly requires a dynamic linker' >&2
            exit 1
          fi
          if readelf -d apps/fn-knock/app/server/go-reauth-proxy-linux-amd64 | grep -q '(NEEDED)'; then
            echo 'Go gateway unexpectedly requires dynamic libraries' >&2
            exit 1
          fi
          cp "dist/fn-knock-artifacts/musl-rust-backends/server-admin-rs-linux-amd64" \
            deploy/docker/rust-backends/server-admin-rs-linux-amd64
          chmod 755 apps/fn-knock/app/server/go-reauth-proxy-linux-amd64 \
            deploy/docker/rust-backends/server-admin-rs-linux-amd64
          ls -l deploy/docker/rust-backends apps/fn-knock/app/server/go-reauth-proxy-linux-amd64

      - name: Compute image reference
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          image="$(printf '%s' "${image}" | tr '[:upper:]' '[:lower:]')"
          version="$(node -p 'require("./version.json").version')"
          echo "name=${image}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tags=${image}:${version}-cname,${image}:main" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

      - name: Smoke-test gateway executable in Alpine image
        shell: bash
        run: |
          image="${{ steps.image.outputs.name }}:main"
          docker pull "${image}"
          docker run --rm --entrypoint /bin/sh "${image}" -c '
            /opt/fn-knock/bin/go-reauth-proxy --help >/tmp/gateway-help 2>&1
            status=$?
            cat /tmp/gateway-help
            if [ "$status" -eq 126 ] || [ "$status" -eq 127 ]; then exit 1; fi
          '